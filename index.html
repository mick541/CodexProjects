<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CodexProjects</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #2563eb, #7c3aed);
      color: white;
    }

    .card {
      width: 90%;
      max-width: 600px;
      padding: 45px 25px;
      text-align: center;
      background: rgba(255, 255, 255, 0.15);
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
    }

    h1 {
      margin-top: 0;
      font-size: 42px;
    }

    p {
      font-size: 20px;
      line-height: 1.6;
    }

    .button {
      display: inline-block;
      margin-top: 20px;
      padding: 14px 26px;
      color: #2563eb;
      background: white;
      border-radius: 10px;
      text-decoration: none;
      font-weight: bold;
    }

    .button:hover {
      background: #e0e7ff;
    }
  </style>
</head>

<body>
  <div class="card">
    <h1>Добро пожаловать!</h1>
    <p>Это мой первый красивый сайт на GitHub Pages.</p>
    <a class="button" href="https://github.com/mick541/CodexProjects">
      Открыть проект
    </a>
  </div>
</body>
</html>
